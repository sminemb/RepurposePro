name: repurposepro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # PostgreSQL's initial user is a superuser. It is bootstrap-only and must
      # never be configured as the application or migration connection.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.database}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.database}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.database}
      # These names are deliberately fixed because SQL migrations, grants, and
      # application URLs depend on the canonical owner/runtime roles.
      POSTGRES_OWNER_USER: repurposepro_owner
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD}
      POSTGRES_RUNTIME_USER: repurposepro_runtime
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD}
      POSTGRES_CHECKOUT_USER: repurposepro_checkout
      POSTGRES_CHECKOUT_PASSWORD: ${POSTGRES_CHECKOUT_PASSWORD:?Set POSTGRES_CHECKOUT_PASSWORD}
      POSTGRES_WEBHOOK_USER: repurposepro_webhook
      POSTGRES_WEBHOOK_PASSWORD: ${POSTGRES_WEBHOOK_PASSWORD:?Set POSTGRES_WEBHOOK_PASSWORD}
      POSTGRES_PROCESSING_USER: repurposepro_processing
      POSTGRES_PROCESSING_PASSWORD: ${POSTGRES_PROCESSING_PASSWORD:?Set POSTGRES_PROCESSING_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.database}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
